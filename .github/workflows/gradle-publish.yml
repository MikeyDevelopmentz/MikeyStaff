name: Build

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Advanced-Staff

      - name: Checkout MikeyCore
        uses: actions/checkout@v4
        with:
          repository: MikeyDevelopmentz/MikeyCore
          ref: main
          path: MikeyCore

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Build with Gradle
        working-directory: Advanced-Staff
        run: ./gradlew coreTest build

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: advanced-staff-jars
          path: |
            Advanced-Staff/plugins/advanced-staff/paper/build/libs/*.jar
            Advanced-Staff/plugins/advanced-staff/velocity/build/libs/*.jar

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: advanced-staff-jars
      # replaces the old latest release every push
      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes -R ${{ github.repository }} || true
          gh release create latest paper/build/libs/*.jar velocity/build/libs/*.jar -R ${{ github.repository }} --target ${{ github.sha }} --title "latest build" --notes "auto build from ${{ github.sha }}"
